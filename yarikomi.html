<style>
.ode-db{font-family:'Meiryo UI','Hiragino Sans',sans-serif;font-size:13px;color:#222;line-height:1.6;max-width:880px}
.ode-db h2{margin:0 0 8px;font-size:22px;color:#3d4b66;letter-spacing:.04em;padding-bottom:6px;border-bottom:2px solid #3d4b66}
.ode-db .lead{margin:8px 0 14px}
.ode-db .list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ode-db .item{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;min-height:110px;padding:8px 10px;border-radius:4px;background:#222;text-decoration:none;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ode-db .bn{position:absolute;inset:-12px;background-size:cover;background-position:50% 50%;filter:blur(3px) brightness(.5);image-rendering:pixelated;transition:filter .2s}
.ode-db a.item:hover .bn{filter:blur(3px) brightness(.7)}
.ode-db .ic,.ode-db .tx,.ode-db .ar{position:relative}
.ode-db .ic{flex:none;display:flex;align-items:center;justify-content:center;width:76px;height:84px}
.ode-db .ic img{image-rendering:pixelated;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.ode-db .run{display:block;width:32px;height:64px;background-size:256px 64px;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));animation:ode-run .24s steps(8) infinite}
@keyframes ode-run{from{background-position:0 0}to{background-position:-256px 0}}
.ode-db .tx{flex:1;min-width:0;text-shadow:0 1px 3px #000,0 0 2px #000}
.ode-db .nm{display:block;font-size:17px;font-weight:bold;letter-spacing:.04em}
.ode-db .ds{display:block;font-size:12px;line-height:1.5;margin-top:2px;opacity:.92;word-break:auto-phrase}
.ode-db .ph{display:inline-block}
.ode-db .ar{font-size:20px;opacity:.8;text-shadow:0 1px 3px #000}
.ode-db .soon{cursor:default;box-shadow:none}
.ode-db .soon .bn{filter:blur(2px) brightness(.8) grayscale(.3)}
.ode-db .soon .tx{opacity:.75}
.ode-db .sn{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid rgba(255,255,255,.6);border-radius:3px;font-size:11px;font-weight:normal;letter-spacing:0;vertical-align:2px;text-shadow:none}
@media (max-width:600px){.ode-db .list{grid-template-columns:1fr;gap:6px}}
</style>
<div class="ode-db">
<h2>やりこみ</h2>
<p class="lead">クリアした後も遊び尽くしたい人のためのページです。不自由な決まりを課して遊ぶ「縛りプレイ」と、速さを競う「RTA」に分けています。「準備中」のページはまだありません。</p>
