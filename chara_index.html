<h2>仲間のキャラクター</h2>
<p class="lead">仲間になる26人の、キャラクター別の詳細ページです。顔をクリックすると、そのキャラクターのページに移ります。各ページには、加入と離脱の条件、加入時のステータスと初期装備、戦闘特技、装備できる武器、レベル別の能力値などをまとめています。</p>
